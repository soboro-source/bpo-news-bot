name: BPO News Crawler

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 코드 가져오기
        uses: actions/checkout@v3

      - name: 파이썬 환경 설정
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: 라이브러리 설치
        run: pip install -r requirements.txt

      - name: 뉴스 수집 파이썬 코드 실행
        run: python main.py
        
      - name: 변경된 뉴스 웹사이트에 자동 업데이트
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add news.json
          git commit -m "🚀 오늘자 뉴스 웹사이트 업데이트" || echo "새로운 뉴스가 없습니다."
          git push
