name: BPO News Crawler

on:
  schedule:
    # 한국 시간(KST) 아침 9시 정각 실행 (영국 UTC 기준 00:00)
    - cron: '0 0 * * *'
  workflow_dispatch: # 수동 테스트 버튼

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 코드 가져오기
        uses: actions/checkout@v3

      - name: 파이썬 환경 설정
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: 라이브러리 설치
        run: pip install -r requirements.txt

      - name: 뉴스 수집 파이썬 코드 실행
        run: python main.py
