<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BPO 뉴스 대시보드</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, "Apple Color Emoji", Arial, sans-serif;
            background-color: #ffffff;
            color: #37352f;
        }
        .notion-tag {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body class="antialiased">
    <header class="max-w-5xl mx-auto px-6 sm:px-8 py-12">
        <div class="text-4xl mb-3">📰</div>
        <h1 class="text-3xl font-bold tracking-tight mb-2 text-gray-900">BPO 일일 뉴스 대시보드</h1>
        <p class="text-gray-500 text-sm">매일 아침 8시 30분, 컨택센터 및 BPO 관련 주요 뉴스가 자동 업데이트 됩니다.</p>
    </header>

    <main class="max-w-5xl mx-auto px-6 sm:px-8 pb-20">
        <!-- 카테고리 필터 (요청하신 순서 적용) -->
        <div class="mb-6 flex flex-wrap gap-2 text-sm" id="category-filter"></div>
        
        <!-- 게시판(리스트) 영역 -->
        <div class="bg-white border border-gray-200 rounded-lg overflow-hidden shadow-sm">
            
            <!-- 테이블 머리글 -->
            <div class="hidden sm:flex items-center justify-between p-3.5 border-b-2 border-gray-100 bg-gray-50 text-[14px] font-bold text-gray-600">
                <div class="flex items-center w-full">
                    <div class="w-32 shrink-0 text-center">구분</div>
                    <div class="flex-grow pl-4">제목</div>
                </div>
                <div class="w-24 shrink-0 text-center">수집일</div>
            </div>
            
            <!-- 실제 뉴스 리스트 컨테이너 -->
            <div id="news-container" class="flex flex-col"></div>
        </div>
    </main>

    <script>
        const categoryColors = {
            "1. 자사 관련": "bg-[#e8def8] text-[#4a3265]",
            "2. 경쟁사 동향": "bg-[#ffe2dd] text-[#5c1a16]",
            "3. 고객사 동향": "bg-[#d3e5ef] text-[#183347]",
            "4. 관련 법 소식": "bg-[#fadec9] text-[#49290e]",
            "5. 지원 정책": "bg-[#dbeddb] text-[#1c3829]",
            "6. 기타 소식": "bg-[#e3e2e0] text-[#32302c]"
        };
        let allNews = [];

        fetch('news.json')
            .then(res => res.json())
            .then(data => {
                allNews = data;
                renderCategories();
                renderNews(allNews);
            })
            .catch(error => {
                document.getElementById('news-container').innerHTML = '<div class="p-8 text-center text-gray-500">뉴스를 불러오는 중입니다...</div>';
            });

        function renderCategories() {
            const filterContainer = document.getElementById('category-filter');
            // 전체보기 뒤에 요청하신 정확한 순서로 카테고리 배치
            const categories = [
                "전체보기", 
                "1. 자사 관련", 
                "2. 경쟁사 동향", 
                "3. 고객사 동향", 
                "4. 관련 법 소식", 
                "5. 지원 정책", 
                "6. 기타 소식"
            ];
            
            categories.forEach(cat => {
                const btn = document.createElement('button');
                btn.innerText = cat;
                btn.className = "px-3 py-1.5 rounded transition-colors text-gray-600 hover:bg-gray-100";
                if (cat === "전체보기") btn.classList.add("font-bold", "text-black", "bg-gray-100");
                
                btn.onclick = (e) => {
                    Array.from(filterContainer.children).forEach(child => {
                        child.classList.remove("font-bold", "text-black", "bg-gray-100");
                    });
                    e.target.classList.add("font-bold", "text-black", "bg-gray-100");
                    renderNews(cat === "전체보기" ? allNews : allNews.filter(news => news.category === cat));
                };
                filterContainer.appendChild(btn);
            });
        }

        function renderNews(newsArray) {
            const container = document.getElementById('news-container');
            container.innerHTML = '';
            
            if (newsArray.length === 0) {
                container.innerHTML = '<div class="p-8 text-center text-gray-500">해당 카테고리의 수집된 뉴스가 없습니다.</div>';
                return;
            }

            newsArray.forEach(news => {
                const colorClass = categoryColors[news.category] || "bg-[#e3e2e0] text-[#32302c]";
                
                const card = `
                    <a href="${news.link}" target="_blank" class="flex flex-col sm:flex-row sm:items-center justify-between p-4 border-b border-gray-100 hover:bg-gray-50 transition-colors group last:border-b-0">
                        <div class="flex flex-col sm:flex-row sm:items-center w-full mb-2 sm:mb-0">
                            <!-- 구분 (태그) -->
                            <div class="w-32 shrink-0 mb-2 sm:mb-0 sm:text-center">
                                <span class="notion-tag ${colorClass}">${news.category}</span>
                            </div>
                            <!-- 기사 제목 -->
                            <div class="flex-grow sm:pl-4">
                                <h2 class="text-[15px] font-medium text-gray-800 group-hover:text-blue-600 truncate max-w-full sm:max-w-2xl">${news.title}</h2>
                            </div>
                        </div>
                        <!-- 수집일 -->
                        <div class="text-[13px] text-gray-400 whitespace-nowrap shrink-0 sm:w-24 sm:text-center">
                            ${news.date}
                        </div>
                    </a>
                `;
                container.innerHTML += card;
            });
        }
    </script>
</body>
</html>
