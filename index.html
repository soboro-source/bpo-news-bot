<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BPO 뉴스 대시보드</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, "Apple Color Emoji", Arial, sans-serif;
            background-color: #ffffff;
            color: #37352f;
        }
        .notion-card {
            border: 1px solid rgba(55, 53, 47, 0.16);
            border-radius: 6px;
            box-shadow: rgba(15, 15, 15, 0.05) 0px 0px 0px 1px, rgba(15, 15, 15, 0.1) 0px 2px 4px;
            transition: background-color 100ms ease-in 0s, transform 100ms ease-in 0s;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            height: 100%;
        }
        .notion-card:hover {
            background-color: rgba(55, 53, 47, 0.03);
            transform: translateY(-2px);
        }
        .notion-tag {
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 13px;
            line-height: 120%;
            display: inline-flex;
            align-items: center;
        }
        .line-clamp-2 {
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
        }
    </style>
</head>
<body class="antialiased">
    <header class="max-w-6xl mx-auto px-6 sm:px-12 py-12">
        <div class="text-4xl mb-3">📰</div>
        <h1 class="text-3xl font-bold tracking-tight mb-2 text-gray-900">BPO 일일 뉴스 대시보드</h1>
        <p class="text-gray-500 text-sm">매일 아침 9시, 컨택센터 및 BPO 관련 주요 뉴스가 자동 업데이트 됩니다.</p>
    </header>

    <main class="max-w-6xl mx-auto px-6 sm:px-12 pb-20">
        <div class="mb-6 flex flex-wrap gap-2 text-sm" id="category-filter"></div>
        <div id="news-container" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-5"></div>
    </main>

    <script>
        const categoryColors = {
            "1. 자사 관련": "bg-[#e8def8] text-[#4a3265]",
            "2. 경쟁사 동향": "bg-[#ffe2dd] text-[#5c1a16]",
            "3. 고객사 동향": "bg-[#d3e5ef] text-[#183347]",
            "4. 관련 법 소식": "bg-[#fadec9] text-[#49290e]",
            "5. 지원 정책": "bg-[#dbeddb] text-[#1c3829]",
            "6. 기타 소식": "bg-[#e3e2e0] text-[#32302c]"
        };
        let allNews = [];

        fetch('news.json')
            .then(res => res.json())
            .then(data => {
                allNews = data;
                renderCategories();
                renderNews(allNews);
            })
            .catch(error => {
                document.getElementById('news-container').innerHTML = '<p class="text-gray-500">뉴스를 불러오는 중입니다...</p>';
            });

        function renderCategories() {
            const filterContainer = document.getElementById('category-filter');
            const categories = ["전체보기", "1. 자사 관련", "2. 경쟁사 동향", "3. 고객사 동향", "4. 관련 법 소식", "5. 지원 정책", "6. 기타 소식"];
            
            categories.forEach(cat => {
                const btn = document.createElement('button');
                btn.innerText = cat;
                btn.className = "px-3 py-1.5 rounded transition-colors text-gray-600 hover:bg-gray-100";
                if (cat === "전체보기") btn.classList.add("font-bold", "text-black", "bg-gray-100");
                
                btn.onclick = (e) => {
                    Array.from(filterContainer.children).forEach(child => {
                        child.classList.remove("font-bold", "text-black", "bg-gray-100");
                    });
                    e.target.classList.add("font-bold", "text-black", "bg-gray-100");
                    renderNews(cat === "전체보기" ? allNews : allNews.filter(news => news.category === cat));
                };
                filterContainer.appendChild(btn);
            });
        }

        function renderNews(newsArray) {
            const container = document.getElementById('news-container');
            container.innerHTML = '';
            
            newsArray.forEach(news => {
                const colorClass = categoryColors[news.category] || "bg-[#e3e2e0] text-[#32302c]";
                
                // 썸네일 이미지가 없을 경우 띄워줄 은은한 회색 바탕의 노션 스타일 기본 썸네일
                const fallbackImg = `https://images.unsplash.com/photo-1585829365295-ab7cd400c167?w=500&auto=format&fit=crop&q=60`;
                const imgSrc = news.image && news.image.trim() !== "" ? news.image : fallbackImg;
                
              const card = `
    <a href="${news.link}" target="_blank" class="flex flex-col sm:flex-row sm:items-center justify-between p-4 border-b border-gray-100 hover:bg-gray-50 transition-colors group">
        <div class="flex items-center gap-3 mb-2 sm:mb-0">
            <span class="notion-tag ${colorClass} shrink-0">${news.category}</span>
            <h2 class="text-[15px] font-semibold text-gray-800 group-hover:text-blue-600">${news.title}</h2>
        </div>
        <div class="text-[13px] text-gray-400 whitespace-nowrap shrink-0">${news.date}</div>
    </a>
`;
                container.innerHTML += card;
            });
        }
    </script>
</body>
</html>
