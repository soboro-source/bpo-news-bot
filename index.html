<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- [보안] 외부 리소스 차단: 이 페이지는 자기 도메인의 news.json만 읽을 수 있음 -->
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src 'self'; base-uri 'none'; form-action 'none'">
    <meta name="referrer" content="no-referrer">
    <title>BPO 뉴스 대시보드</title>

    <!-- [보안] Tailwind CDN 제거 → 필요한 스타일만 직접 작성 (외부 스크립트 의존 없음) -->
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, "Apple SD Gothic Neo", "Malgun Gothic", Arial, sans-serif;
            background: #ffffff;
            color: #37352f;
            -webkit-font-smoothing: antialiased;
        }
        header, main { max-width: 64rem; margin: 0 auto; padding-left: 1.5rem; padding-right: 1.5rem; }
        header { padding-top: 3rem; padding-bottom: 3rem; }
        main { padding-bottom: 5rem; }
        .icon { font-size: 2.25rem; margin-bottom: 0.75rem; }
        h1 { font-size: 1.875rem; font-weight: 700; letter-spacing: -0.025em; margin: 0 0 0.5rem; color: #111827; }
        .desc { color: #6b7280; font-size: 0.875rem; margin: 0; }

        #category-filter { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 1.5rem; font-size: 0.875rem; }
        #category-filter button {
            padding: 0.375rem 0.75rem; border: 0; border-radius: 4px; background: transparent;
            color: #4b5563; cursor: pointer; font: inherit; transition: background-color .15s;
        }
        #category-filter button:hover { background: #f3f4f6; }
        #category-filter button.active { font-weight: 700; color: #000; background: #f3f4f6; }
        #category-filter button:focus-visible, .row:focus-visible { outline: 2px solid #2563eb; outline-offset: 2px; }

        .board { border: 1px solid #e5e7eb; border-radius: 8px; overflow: hidden; box-shadow: 0 1px 2px rgba(0,0,0,.05); }
        .board-head {
            display: none; align-items: center; justify-content: space-between;
            padding: 0.875rem; border-bottom: 2px solid #f3f4f6; background: #f9fafb;
            font-size: 14px; font-weight: 700; color: #4b5563;
        }
        .board-head .l { display: flex; align-items: center; width: 100%; }
        .col-cat { width: 8rem; flex-shrink: 0; text-align: center; }
        .col-title { flex-grow: 1; padding-left: 1rem; }
        .col-date { width: 6rem; flex-shrink: 0; text-align: center; }

        .row {
            display: flex; flex-direction: column; padding: 1rem; border-bottom: 1px solid #f3f4f6;
            text-decoration: none; color: inherit; transition: background-color .15s;
        }
        .row:last-child { border-bottom: 0; }
        .row:hover { background: #f9fafb; }
        .row .cat-wrap { margin-bottom: 0.5rem; }
        .row .title {
            margin: 0; font-size: 15px; font-weight: 500; color: #1f2937;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%;
        }
        .row:hover .title { color: #2563eb; }
        .row .date { margin-top: 0.5rem; font-size: 13px; color: #9ca3af; white-space: nowrap; }

        .notion-tag {
            padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: 600;
            display: inline-flex; align-items: center; justify-content: center;
        }
        .cat-1 { background: #e8def8; color: #4a3265; }
        .cat-2 { background: #ffe2dd; color: #5c1a16; }
        .cat-3 { background: #d3e5ef; color: #183347; }
        .cat-4 { background: #fadec9; color: #49290e; }
        .cat-5 { background: #dbeddb; color: #1c3829; }
        .cat-6, .cat-0 { background: #e3e2e0; color: #32302c; }
        .empty { padding: 2rem; text-align: center; color: #6b7280; }

        @media (min-width: 640px) {
            header, main { padding-left: 2rem; padding-right: 2rem; }
            .board-head { display: flex; }
            .row { flex-direction: row; align-items: center; justify-content: space-between; }
            .row .left { display: flex; align-items: center; width: 100%; }
            .row .cat-wrap { margin-bottom: 0; width: 8rem; flex-shrink: 0; text-align: center; }
            .row .title-wrap { flex-grow: 1; padding-left: 1rem; min-width: 0; }
            .row .title { max-width: 42rem; }
            .row .date { margin-top: 0; width: 6rem; flex-shrink: 0; text-align: center; }
        }
    </style>
</head>
<body>

    <header>
        <div class="icon">📰</div>
        <h1>BPO 일일 뉴스 대시보드</h1>
        <p class="desc">매일 아침 컨택센터 및 BPO 관련 주요 뉴스가 자동 업데이트 됩니다. 수집된 기사는 3일간 저장됩니다.</p>
    </header>

    <main>
        <div id="category-filter"></div>

        <div class="board">
            <div class="board-head">
                <div class="l">
                    <div class="col-cat">구분</div>
                    <div class="col-title">제목</div>
                </div>
                <!-- ★ 수집일 -> 보도일 로 변경 -->
                <div class="col-date">보도일</div>
            </div>
            <div id="news-container"></div>
        </div>
    </main>

    <script>
        // 카테고리별 우선순위 (숫자가 작을수록 상단 노출). 화면용 CSS 클래스 번호와 동일하게 사용
        const categoryOrder = {
            "1. 자사 관련": 1,
            "2. 경쟁사 동향": 2,
            "3. 고객사 동향": 3,
            "4. 관련 법 소식": 4,
            "5. 지원 정책": 5,
            "6. 기타 소식": 6
        };

        let allNews = [];

        // [보안] 링크가 http/https 로 시작할 때만 허용 (javascript: 등 차단)
        function isSafeUrl(value) {
            try {
                const u = new URL(value);
                return u.protocol === 'https:' || u.protocol === 'http:';
            } catch (e) {
                return false;
            }
        }

        // [보안] 값이 비어 있거나 문자열이 아닐 때 대비
        function asText(value) {
            return typeof value === 'string' ? value : '';
        }

        // 메시지 한 줄을 안전하게 표시 (innerHTML 사용 안 함)
        function showMessage(text) {
            const container = document.getElementById('news-container');
            container.replaceChildren();
            const div = document.createElement('div');
            div.className = 'empty';
            div.textContent = text;
            container.appendChild(div);
        }

        fetch('news.json')
            .then(res => {
                if (!res.ok) throw new Error('HTTP ' + res.status);
                return res.json();
            })
            .then(data => {
                if (!Array.isArray(data)) throw new Error('invalid data');

                // [보안] 링크가 안전하지 않은 기사는 목록에서 제외
                allNews = data.filter(n => n && isSafeUrl(n.link));

                allNews.sort((a, b) => {
                    const orderA = categoryOrder[a.category] || 99;
                    const orderB = categoryOrder[b.category] || 99;
                    if (orderA !== orderB) return orderA - orderB;
                    return new Date(b.date) - new Date(a.date);
                });

                renderCategories();
                renderNews(allNews);
            })
            .catch(() => showMessage('뉴스를 불러오는 중입니다...'));

        function renderCategories() {
            const filterContainer = document.getElementById('category-filter');
            const categories = ["전체보기", ...Object.keys(categoryOrder)];

            categories.forEach(cat => {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = cat;
                if (cat === "전체보기") btn.classList.add('active');

                btn.addEventListener('click', () => {
                    Array.from(filterContainer.children).forEach(c => c.classList.remove('active'));
                    btn.classList.add('active');
                    renderNews(cat === "전체보기" ? allNews : allNews.filter(n => n.category === cat));
                });
                filterContainer.appendChild(btn);
            });
        }

        // [보안] innerHTML 대신 DOM API + textContent 로 렌더링 → 제목에 HTML/스크립트가 섞여도 실행되지 않음
        function renderNews(newsArray) {
            const container = document.getElementById('news-container');
            container.replaceChildren();

            if (newsArray.length === 0) {
                showMessage('해당 카테고리의 수집된 뉴스가 없습니다.');
                return;
            }

            const frag = document.createDocumentFragment();

            newsArray.forEach(news => {
                const a = document.createElement('a');
                a.className = 'row';
                a.href = news.link;                          // isSafeUrl 통과한 값만 도달
                a.target = '_blank';
                a.rel = 'noopener noreferrer';               // [보안] 탭내빙 방지

                const left = document.createElement('div');
                left.className = 'left';

                const catWrap = document.createElement('div');
                catWrap.className = 'cat-wrap';
                const tag = document.createElement('span');
                tag.className = 'notion-tag cat-' + (categoryOrder[news.category] || 0);
                tag.textContent = asText(news.category);
                catWrap.appendChild(tag);

                const titleWrap = document.createElement('div');
                titleWrap.className = 'title-wrap';
                const h2 = document.createElement('h2');
                h2.className = 'title';
                h2.textContent = asText(news.title);
                titleWrap.appendChild(h2);

                left.append(catWrap, titleWrap);

                const date = document.createElement('div');
                date.className = 'date';
                date.textContent = asText(news.date);

                a.append(left, date);
                frag.appendChild(a);
            });

            container.appendChild(frag);
        }
    </script>
</body>
</html>
